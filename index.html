<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#75658f" />

    <title>Sensora — комфортная звуковая среда</title>

    <meta
      name="description"
      content="Персональный инструмент звукового комфорта и саморегуляции."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Иконки браузера -->
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />

    <!-- iPhone / iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-title" content="Sensora" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Превью ссылки -->
    <meta property="og:title" content="Sensora — комфортная звуковая среда" />
    <meta
      property="og:description"
      content="Персональный инструмент звукового комфорта и саморегуляции."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://sensora-rosy.vercel.app/assets/icon-512.png"
    />
    <meta property="og:url" content="https://sensora-rosy.vercel.app/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
